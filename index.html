<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════
XENIA PORTAL — FIX PATCH
═══════════════════════════════════════════════════════════════

HOW TO USE:
1. Open your original HTML file in a text editor
2. Find the LAST </script> tag (near the end of file)
3. Just BEFORE that </script>, paste the code below
4. Save the file

That's it. The patch overrides the broken functions without touching anything else.

═══════════════════════════════════════════════════════════════
-->

<script>
// ═══════════════════════════════════════════════════════════════
// PATCH v1 — fix saving for all answer types
// Applies on top of existing code. Overrides broken functions.
// ═══════════════════════════════════════════════════════════════
(function(){
  'use strict';

  // ── Build a stable key for any form element (works even without id) ──
  function elementKey(el){
    if(el.id) return 'id:' + el.id;
    const path = [];
    let cur = el;
    while(cur && cur !== document.body){
      const parent = cur.parentElement;
      if(!parent) break;
      const sameTag = Array.from(parent.children).filter(c =>
        c.tagName === cur.tagName && c.className === cur.className);
      const idx = sameTag.indexOf(cur);
      path.unshift(cur.tagName + '.' + (cur.className||'') + '[' + idx + ']');
      if(parent.id){ path.unshift('#' + parent.id); break; }
      cur = parent;
    }
    return 'p:' + path.join('>');
  }

  // ── Override collectState ──
  window.collectState = function(){
    const state = {};
    document.querySelectorAll(
      'input[type="text"], input[type="url"], input.gap, input.order-input, textarea'
    ).forEach(el => {
      if(el.value !== undefined && el.value !== '') state[elementKey(el)] = el.value;
    });
    document.querySelectorAll('.pick').forEach(pick => {
      const sel = pick.querySelector('.pick-opt.selected');
      if(sel){
        const opts = pick.querySelectorAll('.pick-opt');
        state[elementKey(pick)] = Array.from(opts).indexOf(sel);
      }
    });
    document.querySelectorAll('.tf-row').forEach(row => {
      if(row.querySelector('.sel-t')) state[elementKey(row)] = 'T';
      else if(row.querySelector('.sel-f')) state[elementKey(row)] = 'F';
    });
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      if(cb.checked) state[elementKey(cb)] = true;
    });
    document.querySelectorAll('.simple-hw-list').forEach(list => {
      const listKey = elementKey(list);
      list.querySelectorAll('li').forEach((li, idx) => {
        const chk = li.querySelector('.hw-chk');
        if(chk && chk.classList.contains('done'))
          state[listKey + ':hw:' + idx] = true;
      });
    });
    document.querySelectorAll('.unit-item, .lesson-accordion, .global-notes-wrap').forEach(el => {
      if(el.classList.contains('open')) state['open:' + elementKey(el)] = true;
    });
    return state;
  };

  // ── Override applyState ──
  window.applyState = function(state){
    if(!state) return;
    const focused = document.activeElement;
    document.querySelectorAll(
      'input[type="text"], input[type="url"], input.gap, input.order-input, textarea'
    ).forEach(el => {
      if(el === focused) return;
      const k = elementKey(el);
      if(state[k] !== undefined){
        el.value = state[k];
        const oninput = el.getAttribute('oninput') || '';
        const m = oninput.match(/countWords\(this,\s*['"]([^'"]+)['"]\)/);
        if(m){
          const wcEl = document.getElementById(m[1]);
          if(wcEl) wcEl.textContent =
            (el.value.trim().split(/\s+/).filter(Boolean).length) + ' words';
        }
      }
    });
    document.querySelectorAll('.pick').forEach(pick => {
      const k = elementKey(pick);
      const idx = state[k];
      if(idx !== undefined){
        pick.querySelectorAll('.pick-opt').forEach(o => o.classList.remove('selected'));
        const opts = pick.querySelectorAll('.pick-opt');
        if(opts[idx]) opts[idx].classList.add('selected');
      }
    });
    document.querySelectorAll('.tf-row').forEach(row => {
      const k = elementKey(row);
      const val = state[k];
      row.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('sel-t','sel-f'));
      const btns = row.querySelectorAll('.tf-btn');
      if(val === 'T' && btns[0]) btns[0].classList.add('sel-t');
      else if(val === 'F' && btns[1]) btns[1].classList.add('sel-f');
    });
    document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.checked = state[elementKey(cb)] === true;
    });
    document.querySelectorAll('.simple-hw-list').forEach(list => {
      const listKey = elementKey(list);
      list.querySelectorAll('li').forEach((li, idx) => {
        const chk = li.querySelector('.hw-chk');
        const txt = li.querySelector('.hw-txt');
        if(chk && state[listKey + ':hw:' + idx] === true){
          chk.classList.add('done'); chk.textContent = '✓';
          if(txt) txt.classList.add('done');
        }
      });
    });
    document.querySelectorAll('.unit-item, .lesson-accordion, .global-notes-wrap').forEach(el => {
      const k = elementKey(el);
      if(state['open:' + k] === true) el.classList.add('open');
    });
  };

  // ── Override saveAll (fixed flag logic) ──
  let _saveTimer = null;
  window.saveAll = function(){
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => {
      const state = window.collectState();
      try { localStorage.setItem('xenia_portal_v1', JSON.stringify(state)); } catch {}
      if(window._dbRef){
        window._lastLocalSave = Date.now();
        window._dbRef.set(state)
          .then(() => window.showSynced && window.showSynced('☁️ Saved'))
          .catch(() => window.showSynced && window.showSynced('⚠️ Offline'));
      } else {
        window.showSynced && window.showSynced('💾 Saved locally');
      }
    }, 600);
  };

  // ── Patch the Firebase listener once _dbRef is ready ──
  // Replace the echo-detection flag with a timestamp
  function patchFirebaseListener(){
    if(!window._dbRef){ setTimeout(patchFirebaseListener, 300); return; }
    // Remove old listener and install a new one
    window._dbRef.off('value');
    window._dbRef.on('value', snap => {
      const s = snap.val();
      if(!s) return;
      if(window._lastLocalSave && (Date.now() - window._lastLocalSave) < 2000) return;
      window.applyState(s);
      window.showSynced && window.showSynced('🔄 Synced');
    });
    console.log('[Xenia patch] Firebase listener re-bound.');
  }
  patchFirebaseListener();

  // ── Re-load from localStorage with the NEW applyState ──
  // (the page may have loaded with the old applyState skipping most fields)
  setTimeout(() => {
    try {
      const raw = localStorage.getItem('xenia_portal_v1');
      if(raw) window.applyState(JSON.parse(raw));
    } catch(e){ console.error('[Xenia patch] reload failed', e); }
  }, 500);

  console.log('[Xenia patch] Loaded. collectState/applyState/saveAll overridden.');
})();
</script>
